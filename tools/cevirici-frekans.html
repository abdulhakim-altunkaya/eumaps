<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frekans Birimleri Çevirici - eumaps.org</title>
  <meta name="description" content="Hertz, kilohertz, megahertz, gigahertz, RPM ve saniyedeki çevrim birimleri arasında dönüşüm yapın.">
  <link rel="icon" href="../icons/icon1.png" type="image/png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/cevirici-frekans.css">
</head>
<body>

<header class="navbar">
  <div class="nav-container">
    <div class="brand-box">
      <a href="../index.html" class="logoArea">
        <img src="../icons/icon1.png" class="logoIcon" alt="eumaps.org">
        <span class="logoText">eumaps.org</span>
      </a>
      <span class="tagline">Hesap-kitap platformu</span>
    </div>
  </div>
</header>

<main class="page-container">
  <nav class="breadcrumb" aria-label="Sayfa yolu">
    <a href="../index.html">Ana Sayfa</a>
    <span aria-hidden="true">›</span>
    <a href="../cevirici.html">Birim Çevirici</a>
    <span aria-hidden="true">›</span>
    <span>Frekans</span>
  </nav>

  <section class="converter-section">
    <div class="converter-heading">
      <h1>Frekans Birimleri Çevirici</h1>
    </div>

    <div class="converter-content">
      <form id="frequencyConverterForm" class="converter-form">
        <div class="form-list">
          <div class="form-group">
            <input type="number" class="inputFields" id="hertz" name="hertz" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="hertz">Hertz (Hz)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="kilohertz" name="kilohertz" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="kilohertz">Kilohertz (kHz)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="megahertz" name="megahertz" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="megahertz">Megahertz (MHz)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="gigahertz" name="gigahertz" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="gigahertz">Gigahertz (GHz)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="rpm" name="rpm" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="rpm">Dakikadaki Devir (RPM)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="cyclesPerSecond" name="cyclesPerSecond" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="cyclesPerSecond">Saniyedeki Çevrim (cps)</label>
          </div>
        </div>

        <div id="formMessage" class="form-message" role="alert" aria-live="assertive"></div>

        <div class="button-group">
          <button type="button" id="clearBtn" class="secondary-button">Temizle</button>
        </div>
      </form>
    </div>
  </section>
</main>

<footer>
  <p>© 2020-2026 <strong>eumaps.org</strong></p>
</footer>

<script src="../js/cevirici-frekans.js"></script>
</body>
</html>
