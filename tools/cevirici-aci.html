<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Açı Birimleri Çevirici - eumaps.org</title>
  <meta name="description" content="Derece, radyan, gradyan, yay dakikası, yay saniyesi ve tur birimleri arasında anlık açı dönüşümü yapın.">
  <link rel="icon" href="../icons/icon1.png" type="image/png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/cevirici-aci.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <div class="brand-box">
        <a href="../index.html" class="logoArea">
          <img src="../icons/icon1.png" class="logoIcon" alt="eumaps.org">
          <span class="logoText">eumaps.org</span>
        </a>
        <span class="tagline">Hesap-kitap platformu</span>
      </div>
    </div>
  </header>

  <main class="page-container">
    <nav class="breadcrumb" aria-label="Sayfa yolu">
      <a href="../index.html">Ana Sayfa</a>
      <span aria-hidden="true">›</span>
      <a href="../cevirici.html">Birim Çevirici</a>
      <span aria-hidden="true">›</span>
      <span>Açı</span>
    </nav>

    <section class="converter-section">
      <div class="converter-heading">
        <h1>Açı Birimleri Çevirici</h1>
      </div>

<div class="converter-content">
  <form id="angleConverterForm" class="converter-form">
    <div class="form-list">

      <div class="form-group">
        <input
          type="number"
          class="inputFields"
          id="degree"
          name="degree"
          min="-1000000000"
          max="1000000000"
          step="any"
          inputmode="decimal"
        >
        <label for="degree">Derece °</label>
      </div>

      <div class="form-group">
        <input
          type="number"
          class="inputFields"
          id="radian"
          name="radian"
          min="-1000000000"
          max="1000000000"
          step="any"
          inputmode="decimal"
        >
        <label for="radian">Radyan rad</label>
      </div>

      <div class="form-group">
        <input
          type="number"
          class="inputFields"
          id="gradian"
          name="gradian"
          min="-1000000000"
          max="1000000000"
          step="any"
          inputmode="decimal"
        >
        <label for="gradian">Gradyan grad</label>
      </div>

      <div class="form-group">
        <input
          type="number"
          class="inputFields"
          id="arcminute"
          name="arcminute"
          min="-1000000000"
          max="1000000000"
          step="any"
          inputmode="decimal"
        >
        <label for="arcminute">Yay Dakikası '</label>
      </div>

      <div class="form-group">
        <input
          type="number"
          class="inputFields"
          id="arcsecond"
          name="arcsecond"
          min="-1000000000"
          max="1000000000"
          step="any"
          inputmode="decimal"
        >
        <label for="arcsecond">Yay Saniyesi "</label>
      </div>

      <div class="form-group">
        <input
          type="number"
          class="inputFields"
          id="turn"
          name="turn"
          min="-1000000000"
          max="1000000000"
          step="any"
          inputmode="decimal"
        >
        <label for="turn">Tur</label>
      </div>

    </div>

    <div id="formMessage" class="form-message" role="alert" aria-live="assertive"></div>

    <div class="button-group">
      <button type="button" id="clearBtn" class="secondary-button">
        Temizle
      </button>
    </div>
  </form>
</div>
    </section>
  </main>

  <footer>
    <p>© 2020-2026 <strong>eumaps.org</strong></p>
  </footer>

  <script src="../js/cevirici-aci.js"></script>
</body>
</html>
