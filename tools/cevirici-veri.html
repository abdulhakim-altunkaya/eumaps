<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veri Depolama Birimleri Çevirici - eumaps.org</title>
  <meta name="description" content="Bit, byte, kilobyte, megabyte, gigabyte, terabyte, petabyte ve diğer veri depolama birimleri arasında dönüşüm yapın.">
  <link rel="icon" href="../icons/icon1.png" type="image/png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/cevirici-veri.css">
</head>
<body>

<header class="navbar">
  <div class="nav-container">
    <div class="brand-box">
      <a href="../index.html" class="logoArea">
        <img src="../icons/icon1.png" class="logoIcon" alt="eumaps.org">
        <span class="logoText">eumaps.org</span>
      </a>
      <span class="tagline">Hesap-kitap platformu</span>
    </div>
  </div>
</header>

<main class="page-container">

  <nav class="breadcrumb" aria-label="Sayfa yolu">
    <a href="../index.html">Ana Sayfa</a>
    <span aria-hidden="true">›</span>
    <a href="../cevirici.html">Birim Çevirici</a>
    <span aria-hidden="true">›</span>
    <span>Veri Depolama</span>
  </nav>

  <section class="converter-section">
    <div class="converter-heading">
      <h1>Veri Depolama Birimleri Çevirici</h1>
    </div>

    <div class="converter-content">
      <form id="dataStorageConverterForm" class="converter-form">

        <div class="form-list">
          <div class="form-group">
            <input type="number" class="inputFields" id="bit" name="bit" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="bit">Bit</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="byte" name="byte" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="byte">Byte</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="kilobyte" name="kilobyte" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="kilobyte">Kilobyte (KB)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="megabyte" name="megabyte" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="megabyte">Megabyte (MB)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="gigabyte" name="gigabyte" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="gigabyte">Gigabyte (GB)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="terabyte" name="terabyte" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="terabyte">Terabyte (TB)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="petabyte" name="petabyte" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="petabyte">Petabyte (PB)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="exabyte" name="exabyte" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="exabyte">Exabyte (EB)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="zettabyte" name="zettabyte" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="zettabyte">Zettabyte (ZB)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="yottabyte" name="yottabyte" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="yottabyte">Yottabyte (YB)</label>
          </div>
        </div>

        <div id="formMessage" class="form-message" role="alert" aria-live="assertive"></div>

        <div class="button-group">
          <button type="button" id="clearBtn" class="secondary-button">Temizle</button>
        </div>

      </form>
    </div>
  </section>

</main>

  <footer>
    <p><span><a class="footerLink" href="../about.html">Hakkımızda </a></span> &copy; 2020-2026 <strong>eumaps.org</strong></p>
  </footer>


<script src="../js/cevirici-veri.js"></script>
</body>
</html>
