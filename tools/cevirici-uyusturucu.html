<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opioid-Uyuşturucu Birimleri Bilgi Aracı - eumaps.org</title>
  <meta name="description" content="Opioid ilaçların ölçü birimlerini görüntülemek için bilgi aracı.">
  <link rel="icon" href="../icons/icon1.png" type="image/png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/cevirici-uyusturucu.css">
</head>
<body>

<header class="navbar">
  <div class="nav-container">
    <div class="brand-box">
      <a href="../index.html" class="logoArea">
        <img src="../icons/icon1.png" class="logoIcon" alt="eumaps.org">
        <span class="logoText">eumaps.org</span>
      </a>
      <span class="tagline">Hesap-kitap platformu</span>
    </div>
  </div>
</header>

<main class="page-container">
  <nav class="breadcrumb" aria-label="Sayfa yolu">
    <a href="../index.html">Ana Sayfa</a>
    <span>›</span>
    <a href="../cevirici.html">Birim Çevirici</a>
    <span>›</span>
    <span>Opioid/Uyuşturucu</span>
  </nav>

  <section class="converter-section">
    <div class="converter-heading"><h1>Opioid/Uyuşturucu Birimleri Bilgi Aracı</h1></div>

    <div class="converter-content">
      <form id="opioidConverterForm" class="converter-form">
        <div class="form-list">
          <div class="form-group">
            <input type="number" class="inputFields" id="morphine" name="morphine" min="0" step="any" inputmode="decimal">
            <label for="morphine">Morfin (mg)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="oxycodone" name="oxycodone" min="0" step="any" inputmode="decimal">
            <label for="oxycodone">Oksikodon (mg)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="hydrocodone" name="hydrocodone" min="0" step="any" inputmode="decimal">
            <label for="hydrocodone">Hidrokodon (mg)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="tramadol" name="tramadol" min="0" step="any" inputmode="decimal">
            <label for="tramadol">Tramadol (mg)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="codeine" name="codeine" min="0" step="any" inputmode="decimal">
            <label for="codeine">Kodein (mg)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="hydromorphone" name="hydromorphone" min="0" step="any" inputmode="decimal">
            <label for="hydromorphone">Hidromorfon (mg)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="fentanyl" name="fentanyl" min="0" step="any" inputmode="decimal">
            <label for="fentanyl">Fentanil yaması (mcg/saat)</label>
          </div>
        </div>

        <div class="warning-box">
          Bu sayfa ilaç değiştirme veya doz belirleme amacıyla kullanılmamalıdır.
        </div>

        <div class="button-group">
          <button type="button" id="clearBtn" class="secondary-button">Temizle</button>
        </div>
      </form>
    </div>
  </section>
</main>

  <footer>
    <p><span><a class="footerLink" href="../about.html">Hakkımızda </a></span> &copy; 2020-2026 <strong>eumaps.org</strong></p>
  </footer>


<script src="../js/cevirici-uyusturucu.js"></script>
</body>
</html>
