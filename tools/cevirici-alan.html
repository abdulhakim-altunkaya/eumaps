<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alan Birimleri Çevirici - eumaps.org</title>
  <meta name="description" content="Metrekare, dönüm, kilometrekare, hektar, acre, feet kare, inch kare ve diğer alan birimleri arasında dönüşüm yapın.">
  <link rel="icon" href="../icons/icon1.png" type="image/png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/cevirici-alan.css">
</head>
<body>

<header class="navbar">
  <div class="nav-container">
    <div class="brand-box">
      <a href="../index.html" class="logoArea">
        <img src="../icons/icon1.png" class="logoIcon" alt="eumaps.org">
        <span class="logoText">eumaps.org</span>
      </a>
      <span class="tagline">Hesap-kitap platformu</span>
    </div>
  </div>
</header>

<main class="page-container">

  <nav class="breadcrumb" aria-label="Sayfa yolu">
    <a href="../index.html">Ana Sayfa</a>
    <span aria-hidden="true">›</span>
    <a href="../cevirici.html">Birim Çevirici</a>
    <span aria-hidden="true">›</span>
    <span>Alan</span>
  </nav>

  <section class="converter-section">

    <div class="converter-heading">
      <h1>Alan Birimleri Çevirici</h1>
    </div>

    <div class="converter-content">

      <form id="areaConverterForm" class="converter-form">
        <div class="form-list">
          <div class="form-group">
            <input type="number" class="inputFields" id="sqMillimeter" name="sqMillimeter" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="sqMillimeter">Milimetrekare (mm²)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="sqCentimeter" name="sqCentimeter" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="sqCentimeter">Santimetrekare (cm²)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="sqMeter" name="sqMeter" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="sqMeter">Metrekare (m²)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="donum" name="donum" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="donum">Dönüm</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="sqKilometer" name="sqKilometer" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="sqKilometer">Kilometrekare (km²)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="sqFeet" name="sqFeet" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="sqFeet">Feet Kare (ft²)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="sqInch" name="sqInch" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="sqInch">İnç Kare (in²)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="sqYard" name="sqYard" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="sqYard">Yard Kare (yd²)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="acre" name="acre" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="acre">Akre</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="hectare" name="hectare" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="hectare">Hektar (ha)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="sqMile" name="sqMile" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="sqMile">Mil Kare (mi²)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="are" name="are" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="are">Ar</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="sqMicrometer" name="sqMicrometer" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="sqMicrometer">Mikrometrekare (μm²)</label>
          </div>
          <div class="form-group">
            <input type="number" class="inputFields" id="barn" name="barn" min="0" max="1000000000" step="any" inputmode="decimal">
            <label for="barn">Barn (b)</label>
          </div>
        </div>

        <div id="formMessage" class="form-message" role="alert" aria-live="assertive"></div>

        <div class="button-group">
          <button type="button" id="clearBtn" class="secondary-button">Temizle</button>
        </div>

      </form>
    </div>
  </section>
</main>

<footer>
  <p>© 2020-2026 <strong>eumaps.org</strong></p>
</footer>

<script src="../js/cevirici-alan.js"></script>

</body>
</html>
