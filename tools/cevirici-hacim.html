 <!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacim Birimleri Çevirici - eumaps.org</title>
  <meta name="description" content="Mililitre, litre, metreküp, galon, pint, quart, cup, çay kaşığı, yemek kaşığı ve diğer hacim birimleri arasında dönüşüm yapın.">
  <link rel="icon" href="../icons/icon1.png" type="image/png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/cevirici-hacim.css">
</head>
<body>

<header class="navbar">
  <div class="nav-container">
    <div class="brand-box">
      <a href="../index.html" class="logoArea">
        <img src="../icons/icon1.png" class="logoIcon" alt="eumaps.org">
        <span class="logoText">eumaps.org</span>
      </a>
      <span class="tagline">Hesap-kitap platformu</span>
    </div>
  </div>
</header>

<main class="page-container">

  <nav class="breadcrumb" aria-label="Sayfa yolu">
    <a href="../index.html">Ana Sayfa</a>
    <span>›</span>
    <a href="../cevirici.html">Birim Çevirici</a>
    <span>›</span>
    <span>Hacim</span>
  </nav>

  <section class="converter-section">
    <div class="converter-heading">
      <h1>Hacim Birimleri Çevirici</h1>
    </div>

    <div class="converter-content">
      <form id="volumeConverterForm" class="converter-form">

        <div class="form-list">

          <div class="form-group">
            <input type="number" class="inputFields" id="cubicMillimeter" name="cubicMillimeter" min="0" max="1000000000" step="any">
            <label for="cubicMillimeter">Milimetreküp (mm³)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="milliliter" name="milliliter" min="0" max="1000000000" step="any">
            <label for="milliliter">Mililitre (mL)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="cubicCentimeter" name="cubicCentimeter" min="0" max="1000000000" step="any">
            <label for="cubicCentimeter">Santimetreküp (cm³)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="liter" name="liter" min="0" max="1000000000" step="any">
            <label for="liter">Litre (L)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="cubicMeter" name="cubicMeter" min="0" max="1000000000" step="any">
            <label for="cubicMeter">Metreküp (m³)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="cubicKilometer" name="cubicKilometer" min="0" max="1000000000" step="any">
            <label for="cubicKilometer">Kilometreküp (km³)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="cubicInch" name="cubicInch" min="0" max="1000000000" step="any">
            <label for="cubicInch">İnçküp (in³)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="cubicFeet" name="cubicFeet" min="0" max="1000000000" step="any">
            <label for="cubicFeet">Fitküp (ft³)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="cubicYard" name="cubicYard" min="0" max="1000000000" step="any">
            <label for="cubicYard">Yardküp (yd³)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="gallonUS" name="gallonUS" min="0" max="1000000000" step="any">
            <label for="gallonUS">Galon (ABD)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="gallonIMP" name="gallonIMP" min="0" max="1000000000" step="any">
            <label for="gallonIMP">Galon (İngiliz)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="quartUS" name="quartUS" min="0" max="1000000000" step="any">
            <label for="quartUS">Quart (ABD)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="quartIMP" name="quartIMP" min="0" max="1000000000" step="any">
            <label for="quartIMP">Quart (İngiliz)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="pintUS" name="pintUS" min="0" max="1000000000" step="any">
            <label for="pintUS">Pint (ABD)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="pintIMP" name="pintIMP" min="0" max="1000000000" step="any">
            <label for="pintIMP">Pint (İngiliz)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="fluidOunceUS" name="fluidOunceUS" min="0" max="1000000000" step="any">
            <label for="fluidOunceUS">Sıvı Ons (ABD)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="fluidOunceIMP" name="fluidOunceIMP" min="0" max="1000000000" step="any">
            <label for="fluidOunceIMP">Sıvı Ons (İngiliz)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="cupUS" name="cupUS" min="0" max="1000000000" step="any">
            <label for="cupUS">Cup/Bardak (ABD)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="cupMET" name="cupMET" min="0" max="1000000000" step="any">
            <label for="cupMET">Metrik Cup/Bardak</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="barrel" name="barrel" min="0" max="1000000000" step="any">
            <label for="barrel">Petrol Varili</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="teaspoon" name="teaspoon" min="0" max="1000000000" step="any">
            <label for="teaspoon">Çay Kaşığı (tsp)</label>
          </div>

          <div class="form-group">
            <input type="number" class="inputFields" id="tablespoon" name="tablespoon" min="0" max="1000000000" step="any">
            <label for="tablespoon">Yemek Kaşığı (tbsp)</label>
          </div>

        </div>

        <div id="formMessage" class="form-message" role="alert" aria-live="assertive"></div>

        <div class="button-group">
          <button type="button" id="clearBtn" class="secondary-button">Temizle</button>
        </div>

      </form>
    </div>
  </section>

</main>

<footer>
  <p>© 2020-2026 <strong>eumaps.org</strong></p>
</footer>

<script src="../js/cevirici-hacim.js"></script>

</body>
</html>
