<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uzunluk Birimleri Çevirici - eumaps.org</title>
  <meta name="description" content="Metre, kilometre, santimetre, milimetre, inç, fit, yard, mil ve diğer uzunluk birimlerini hızlıca birbirine çevirin.">
  <link rel="icon" href="../icons/icon1.png" type="image/png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/cevirici-uzunluk.css">
</head>
<body>

<header class="navbar">
  <div class="nav-container">
    <div class="brand-box">
      <a href="../index.html" class="logoArea">
        <img src="../icons/icon1.png" class="logoIcon" alt="eumaps.org">
        <span class="logoText">eumaps.org</span>
      </a>
      <span class="tagline">Hesap-kitap platformu</span>
    </div>
  </div>
</header>

<main class="page-container">
  <nav class="breadcrumb">
    <a href="../index.html">Ana Sayfa</a>
    <span>›</span>
    <a href="../cevirici.html">Birim Çeviriciler</a>
    <span>›</span>
    <span>Uzunluk</span>
  </nav>

  <section class="calculator-section">
    <div class="calculator-heading">
      <h1>Uzunluk Birimleri Çevirici</h1>
    </div>

    <div class="calculator-content">
      <form id="lengthConverterForm" class="converter-form">
        <div class="converter-row"><input type="number" class="inputFields" id="attometer" name="attometer" min="0" max="1000000000" step="any"><label for="attometer">Attometre (am)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="femtometer" name="femtometer" min="0" max="1000000000" step="any"><label for="femtometer">Femtometre (fm)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="picometer" name="picometer" min="0" max="1000000000" step="any"><label for="picometer">Pikometre (pm)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="nanometer" name="nanometer" min="0" max="1000000000" step="any"><label for="nanometer">Nanometre (nm)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="micrometer" name="micrometer" min="0" max="1000000000" step="any"><label for="micrometer">Mikrometre (µm)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="millimeter" name="millimeter" min="0" max="1000000000" step="any"><label for="millimeter">Milimetre (mm)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="centimeter" name="centimeter" min="0" max="1000000000" step="any"><label for="centimeter">Santimetre (cm)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="meter" name="meter" min="0" max="1000000000" step="any"><label for="meter">Metre (m)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="kilometer" name="kilometer" min="0" max="1000000000" step="any"><label for="kilometer">Kilometre (km)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="thou" name="thou" min="0" max="1000000000" step="any"><label for="thou">Thou (th)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="inch" name="inch" min="0" max="1000000000" step="any"><label for="inch">İnç (in)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="feet" name="feet" min="0" max="1000000000" step="any"><label for="feet">Fit (ft)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="yard" name="yard" min="0" max="1000000000" step="any"><label for="yard">Yard (yd)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="mileLand" name="mileLand" min="0" max="1000000000" step="any"><label for="mileLand">Kara Mili</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="mileSea" name="mileSea" min="0" max="1000000000" step="any"><label for="mileSea">Deniz Mili</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="astroUnit" name="astroUnit" min="0" max="1000000000" step="any"><label for="astroUnit">Astronomik Birim (AU)</label></div>
        <div class="converter-row"><input type="number" class="inputFields" id="lightYear" name="lightYear" min="0" max="1000000000" step="any"><label for="lightYear">Işık Yılı (ly)</label></div>

        <div class="button-group">
          <button class="secondary-button" type="button" onclick="clearFields()">Temizle</button>
        </div>
      </form>
    </div>
  </section>
</main>

  <footer>
    <p><span><a class="footerLink" href="../about.html">Hakkımızda </a></span> &copy; 2020-2026 <strong>eumaps.org</strong></p>
  </footer>


<script src="../js/cevirici-uzunluk.js"></script>
</body>
</html>
