<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sıcaklık Birimleri Çevirici - eumaps.org</title>
  <meta name="description" content="Celsius, Fahrenheit, Kelvin, Rankine ve Réaumur sıcaklık birimleri arasında dönüşüm yapın.">
  <link rel="icon" href="../icons/icon1.png" type="image/png">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/cevirici-sicaklik.css">
</head>
<body>

<header class="navbar">
  <div class="nav-container">
    <div class="brand-box">
      <a href="../index.html" class="logoArea">
        <img src="../icons/icon1.png" class="logoIcon" alt="eumaps.org">
        <span class="logoText">eumaps.org</span>
      </a>
      <span class="tagline">Hesap-kitap platformu</span>
    </div>
  </div>
</header>

<main class="page-container">
  <nav class="breadcrumb" aria-label="Sayfa yolu">
    <a href="../index.html">Ana Sayfa</a>
    <span>›</span>
    <a href="../cevirici.html">Birim Çevirici</a>
    <span>›</span>
    <span>Sıcaklık</span>
  </nav>

  <section class="converter-section">
    <div class="converter-heading">
      <h1>Sıcaklık Birimleri Çevirici</h1>
    </div>

    <div class="converter-content">
      <form id="temperatureConverterForm" class="converter-form">
        <div class="form-list">
          <div class="form-group"><input type="number" class="inputFields" id="celsius" name="celsius" min="-1000000" max="1000000" step="any"><label for="celsius">Celsius (°C)</label></div>
          <div class="form-group"><input type="number" class="inputFields" id="fahrenheit" name="fahrenheit" min="-1000000" max="1000000" step="any"><label for="fahrenheit">Fahrenheit (°F)</label></div>
          <div class="form-group"><input type="number" class="inputFields" id="kelvin" name="kelvin" min="0" max="1000000" step="any"><label for="kelvin">Kelvin (K)</label></div>
          <div class="form-group"><input type="number" class="inputFields" id="rankine" name="rankine" min="0" max="1000000" step="any"><label for="rankine">Rankine (°R)</label></div>
          <div class="form-group"><input type="number" class="inputFields" id="reaumur" name="reaumur" min="-1000000" max="1000000" step="any"><label for="reaumur">Réaumur (°Re)</label></div>
        </div>

        <div id="formMessage" class="form-message" role="alert" aria-live="assertive"></div>

        <div class="button-group">
          <button type="button" id="clearBtn" class="secondary-button">Temizle</button>
        </div>
      </form>
    </div>
  </section>
</main>

  <footer>
    <p><span><a class="footerLink" href="../about.html">Hakkımızda </a></span> &copy; 2020-2026 <strong>eumaps.org</strong></p>
  </footer>


<script src="../js/cevirici-sicaklik.js"></script>
</body>
</html>
