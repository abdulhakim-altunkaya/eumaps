<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vize Kalış Süresi Hesaplama — eumaps.org</title>

  <meta
    name="description"
    content="Schengen veya Türkiye için giriş ve çıkış tarihlerinizi ekleyerek 180 gün içinde 90 günlük kalış sürenizi hesaplayın."
  />

  <link rel="stylesheet" href="./css/index.css" />
  <link rel="stylesheet" href="./css/vize.css" />
  <link rel="icon" href="./icons/icon1.png" type="image/png" />
</head>

<body>
  <header class="navbar">
    <div class="nav-container">
      <div class="brand-box">
        <a href="./index.html" class="logoArea">
          <img src="./icons/icon1.png" class="logoIcon" alt="eumaps.org" />
          <span class="logoText">eumaps.org</span>
        </a>

        <span class="tagline">Hesap-kitap platformu</span>
      </div>
    </div>
  </header>

  <main class="page-container">
    <nav class="breadcrumb" aria-label="Sayfa yolu">
      <a href="./index.html">Ana Sayfa</a>
      <span aria-hidden="true">›</span>
      <span>Vize Süre Hesaplama</span>
    </nav>

    <section class="visa-section">
      <div class="visa-heading">
        <div class="heading-icon">
          <img
            src="./icons/schengen.png"
            alt=""
            aria-hidden="true"
          />
        </div>

        <div>
          <h1>Vize Kalış Süresi Hesaplama</h1>
        </div>
      </div>

      <div class="visa-content">
        <form id="visaForm" class="visa-form" novalidate>
          <div class="form-group">
            <label for="regionSelect">Hesaplama türü</label>

            <select id="regionSelect" name="region">
              <option value="schengen">Schengen kalış süresi</option>
              <option value="turkiye">Türkiye kalış süresi</option>
            </select>
          </div>

          <div class="date-grid">
            <div class="form-group">
              <label for="entryDate">Giriş tarihi</label>

              <input
                type="date"
                id="entryDate"
                name="entryDate"
                required
              />
            </div>

            <div class="form-group">
              <label for="exitDate">Çıkış tarihi</label>

              <input
                type="date"
                id="exitDate"
                name="exitDate"
                required
              />
            </div>
          </div>

          <div
            id="formMessage"
            class="form-message"
            role="alert"
            aria-live="assertive"
          ></div>

          <div class="button-group">
            <button type="submit" class="primary-button">Seyahat Ekle</button>
            <button type="button" id="clearAllBtn" class="secondary-button">
              Temizle
            </button>
          </div>
        </form>

        <aside class="rule-box">
          <h2>90/180 gün kuralı</h2>
          <p>Giriş ve çıkış günleri dahil olmak üzere geriye dönük herhangi bir 180 günlük dönemde 
            en fazla 90 gün kalınabilir.</p>
        </aside>
      </div>
    </section>

    <section id="tripsSection" class="trips-section" hidden>
      <div class="section-heading">
        <h2>Eklenen Seyahatler</h2>
        <span id="tripCount">0 seyahat</span>
      </div>

      <ul id="tripList" class="trip-list"></ul>
    </section>

    <section
      id="resultSection"
      class="result-section"
      aria-live="polite"
    >
      <div id="resultArea" class="result-area">
        <p>
        </p>
      </div>
    </section>
  </main>

  <footer>
    <p><span><a class="footerLink" href="./about.html">Hakkımızda </a></span> &copy; 2020-2026 <strong>eumaps.org</strong></p>
  </footer>

  <script src="./js/vize.js"></script>
</body>
</html>
